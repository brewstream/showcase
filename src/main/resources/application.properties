spring.application.name=brewstream-showcase
server.port=8080

# The SRT port ffmpeg or OBS publishes to.
brewstream.srt.port=9000
# TSBPD latency in milliseconds: the recovery budget ARQ gets before TLPKTDROP
# abandons a packet.
#
# Deliberately below the 120ms a real deployment would use. On loopback the
# round trip is under a millisecond, so at 120ms ARQ gets hundreds of retry
# opportunities and recovers essentially anything the relay throws away - the
# demonstration has no reachable breaking point and every setting looks healthy.
# At 30ms the budget runs out somewhere the slider can reach, which is what makes
# the trade-off visible. Raise it to 120 to watch the damage disappear again.
brewstream.srt.latency-ms=30

# The lossy relay publishers point at. Packets go proxy -> SRT listener, with a
# settable fraction discarded in both directions so retransmission has to
# survive losing its own NAKs and ACKs.
brewstream.proxy.port=9001

# The default recovery budget for outbound connections, in milliseconds.
#
# Deliberately NOT the listener's 30ms. That figure exists to give the loss
# slider a reachable breaking point on loopback, where the round trip is under a
# millisecond. The caller page has no slider and talks to real sources over real
# paths, where 30ms is far below any sane budget - it would show packets being
# dropped constantly and make a healthy source look broken.
#
# 120ms is the usual starting point, and the rule of thumb is three to four times
# the path's round-trip time. Every connection can override it on the page.
brewstream.caller.latency-ms=120

# The relay page runs Barista brews. Their SRT listener ports come from this
# range, kept clear of the listener (9000) and the loss relay (9001) above.
barista.node.id=showcase
barista.node.published-host=127.0.0.1
barista.ports.srt=9100-9199

# Speech model for relay transcripts, from Hugging Face on first use. The tiny
# one (inference4j/moonshine-streaming-tiny-en) is faster and less accurate.
brewstream.transcript.model=inference4j/moonshine-streaming-small-en
