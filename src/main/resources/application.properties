spring.application.name=brewstream-showcase
server.port=8080

# The SRT port ffmpeg or OBS publishes to.
brewstream.srt.port=9000
# TSBPD latency in milliseconds: the recovery budget ARQ gets before TLPKTDROP
# abandons a packet.
#
# Deliberately below the 120ms a real deployment would use. On loopback the
# round trip is under a millisecond, so at 120ms ARQ gets hundreds of retry
# opportunities and recovers essentially anything the relay throws away - the
# demonstration has no reachable breaking point and every setting looks healthy.
# At 30ms the budget runs out somewhere the slider can reach, which is what makes
# the trade-off visible. Raise it to 120 to watch the damage disappear again.
brewstream.srt.latency-ms=30

# The lossy relay publishers point at. Packets go proxy -> SRT listener, with a
# settable fraction discarded in both directions so retransmission has to
# survive losing its own NAKs and ACKs.
brewstream.proxy.port=9001
