spring.application.name=brewstream-showcase
server.port=8080

# The SRT port ffmpeg or OBS publishes to.
brewstream.srt.port=9000
# TSBPD latency in milliseconds - the recovery budget ARQ gets before TLPKTDROP
# abandons a packet. Raising it is the single most visible knob in the demo.
brewstream.srt.latency-ms=120
