rootProject.name = 'brewstream-showcase'

// Grind is not published yet, so it comes from the sibling checkout. The
// substitutions are kept explicit even though the project and artifact names now
// agree: Gradle matches a composite build on the *project* name, and stating the
// mapping means a future divergence fails here rather than silently resolving
// against something stale from a repository.
includeBuild('../grind') {
    dependencySubstitution {
        substitute module('io.github.brewstream:grind-core') using project(':grind-core')
        substitute module('io.github.brewstream:grind-netty') using project(':grind-netty')
        substitute module('io.github.brewstream:grind-scte') using project(':grind-scte')
    }
}
