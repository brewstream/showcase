// To work against local changes to Grind instead, uncomment the composite build
// below. The substitutions have to be spelled out: Gradle matches a composite on
// the *project* name, and without them the dependencies quietly resolve against
// the published version while appearing to use the local one.
//
// includeBuild('../grind') {
//     dependencySubstitution {
//         substitute module('io.github.brewstream:grind-core') using project(':grind-core')
//         substitute module('io.github.brewstream:grind-netty') using project(':grind-netty')
//         substitute module('io.github.brewstream:grind-scte') using project(':grind-scte')
//     }
// }
